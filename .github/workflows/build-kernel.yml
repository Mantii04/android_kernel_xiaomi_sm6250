name: Build Kernel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      # 1. Checkout your kernel source
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Mantii04/android_kernel_xiaomi_sm6250
          ref: lineage-23.2
          path: kernel-source

      # 2. Build using the EXACT AOSP Clang r596125
      - name: Build Kernel with AOSP Clang r596125
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: ./kernel-source/
          config: vendor/xiaomi/miatoll-perf_defconfig
          arch: arm64
          android-version: '16'
          
          # Use the exact toolchain via direct download URL
          other-clang-url: 'https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r596125.tar.gz'
          
          # Or use the AOSP option directly (try this first)
          # aosp-clang: true
          # aosp-clang-version: r596125
          
          anykernel3: true
