name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Mantii04/android_kernel_xiaomi_sm6250
          ref: lineage-23.2
          path: kernel

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libelf-dev libssl-dev python3 zip

      - name: Patch erofs utils.c
        run: |
          cd ${{ github.workspace }}/kernel
          sed -i '1i #include <linux/xarray.h>' fs/erofs/utils.c
          head -5 fs/erofs/utils.c

      - name: Download AOSP Clang r596125
        run: |
          set -e
          mkdir -p ${{ github.workspace }}/toolchain/clang
          cd ${{ github.workspace }}/toolchain/clang
          COMMIT="663361308e09e4dc3c3b9c5f97c19f9c61e8a0ac"
          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${COMMIT}/clang-r596125.tar.gz"
          curl -L -A "Mozilla/5.0" -o clang.tar.gz "$URL"
          tar -xzf clang.tar.gz
          ./bin/clang --version

      - name: Download AOSP GCC 4.9 from LineageOS Mirror
        run: |
          set -e
          cd ${{ github.workspace }}/toolchain
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc-aarch64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc-arm
          ${{ github.workspace }}/toolchain/gcc-aarch64/bin/aarch64-linux-android-gcc --version
          ${{ github.workspace }}/toolchain/gcc-arm/bin/arm-linux-androideabi-gcc --version

      - name: Build Kernel
        run: |
          set -e
          cd ${{ github.workspace }}/kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=${{ github.workspace }}/toolchain/clang/bin:${{ github.workspace }}/toolchain/gcc-aarch64/bin:${{ github.workspace }}/toolchain/gcc-arm/bin:$PATH
          
          MAKE_ARGS="ARCH=arm64 O=out CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip"
          
          make $MAKE_ARGS vendor/xiaomi/miatoll-perf_defconfig
          
          scripts/config --file out/.config --disable DEBUG_INFO_DWARF5
          scripts/config --file out/.config --disable DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT
          scripts/config --file out/.config --enable DEBUG_INFO_DWARF4
          
          make $MAKE_ARGS olddefconfig
          
          # Build ONLY Image.gz - no DTB dependency
          make $MAKE_ARGS -j$(nproc) Image.gz

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          echo "=== Kernel artifacts available ==="
          ls -la ${{ github.workspace }}/kernel/out/arch/arm64/boot/
          cp ${{ github.workspace }}/kernel/out/arch/arm64/boot/Image.gz AnyKernel3/ && echo "Copied Image.gz"
          ls -la AnyKernel3/
          cd AnyKernel3
          zip -r9 ../AnyKernel3.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3
          path: AnyKernel3.zip
