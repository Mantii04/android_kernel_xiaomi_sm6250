name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Mantii04/android_kernel_xiaomi_sm6250
          ref: lineage-23.2
          path: kernel

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libelf-dev libssl-dev python3 zip

      - name: Download AOSP Clang r596125
        run: |
          mkdir -p ${{ github.workspace }}/toolchain/clang
          cd ${{ github.workspace }}/toolchain/clang
          # Use curl with a browser user-agent to bypass Google's 400 error
          curl -L -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36" \
            -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r596125.tar.gz"
          # Check if the download was successful (file size > 100MB)
          if [ ! -s clang.tar.gz ] || [ $(stat -c%s clang.tar.gz) -lt 100000000 ]; then
            echo "Google download failed, trying fallback from GitHub release..."
            curl -L -o clang.tar.gz \
              "https://github.com/FlopKernel-Series/flop_s5e8825_kernel/releases/download/v6.3.3/clang-r596125.tar.gz"
          fi
          tar -xzf clang.tar.gz
          echo "=== Clang version ==="
          ./bin/clang --version

      - name: Download AOSP GCC 4.9
        run: |
          cd ${{ github.workspace }}/toolchain
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc-aarch64
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc-arm

      - name: Build Kernel
        run: |
          cd ${{ github.workspace }}/kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=${{ github.workspace }}/toolchain/clang/bin:${{ github.workspace }}/toolchain/gcc-aarch64/bin:${{ github.workspace }}/toolchain/gcc-arm/bin:$PATH
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export STRIP=llvm-strip
          make O=out ARCH=arm64 vendor/xiaomi/miatoll-perf_defconfig
          make O=out ARCH=arm64 -j$(nproc)

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          cp ${{ github.workspace }}/kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null || cp ${{ github.workspace }}/kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
          cd AnyKernel3
          zip -r9 ../AnyKernel3.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3
          path: AnyKernel3.zip
