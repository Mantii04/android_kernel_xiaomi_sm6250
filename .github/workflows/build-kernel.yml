name: Build Kernel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      # 1. Checkout your kernel source
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Mantii04/android_kernel_xiaomi_sm6250
          ref: lineage-23.2
          path: kernel-source

      # 2. Manually download the EXACT AOSP Clang r596125 toolchain
      - name: Download AOSP Clang r596125
        run: |
          mkdir -p ${{ github.workspace }}/clang-r596125
          cd ${{ github.workspace }}/clang-r596125
          # Download from Google's official AOSP prebuilt repository
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r596125.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz
          echo "Clang downloaded successfully:"
          ls -la bin/clang | head -1

      # 3. Build using the stable action, pointing to our manual Clang
      - name: Build Kernel with Exact AOSP Clang
        uses: dabao1955/kernel_build_action@v1.5.1
        with:
          kernel-url: ./kernel-source/
          config: vendor/xiaomi/miatoll-perf_defconfig
          arch: arm64
          android-version: '16'

          # Disable the action's built-in toolchain downloads
          aosp-clang: false
          aosp-gcc: false

          # Point to our manually downloaded Clang
          other-clang-url: 'file://${{ github.workspace }}/clang-r596125'
          other-clang-branch: 'master'

          anykernel3: true
