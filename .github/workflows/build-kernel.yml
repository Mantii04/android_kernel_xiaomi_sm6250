name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Mantii04/android_kernel_xiaomi_sm6250
          ref: lineage-23.2
          path: kernel

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libelf-dev libssl-dev python3 zip jq

      - name: Download AOSP Clang r596125
        run: |
          mkdir -p ${{ github.workspace }}/toolchain/clang
          cd ${{ github.workspace }}/toolchain/clang
          
          # Find the download URL via GitHub API
          echo "Searching for clang-r596125 in Zycromerz/Clang releases..."
          CLANG_URL=$(curl -s "https://api.github.com/repos/Zycromerz/Clang/releases?per_page=100" | \
            jq -r '.[] | .assets[]? | select(.name | test("r596125")) | .browser_download_url' | head -1)
          
          if [ -z "$CLANG_URL" ]; then
            echo "Searching in DevMhrn/Clang..."
            CLANG_URL=$(curl -s "https://api.github.com/repos/DevMhrn/Clang/releases?per_page=100" | \
              jq -r '.[] | .assets[]? | select(.name | test("r596125")) | .browser_download_url' | head -1)
          fi
          
          if [ -z "$CLANG_URL" ]; then
            echo "ERROR: Could not find r596125 asset"
            exit 1
          fi
          
          echo "Downloading from: $CLANG_URL"
          curl -L -o clang-archive "$CLANG_URL"
          
          # Extract based on file type
          if [[ "$CLANG_URL" == *.xz ]]; then
            tar -xJf clang-archive
          else
            tar -xzf clang-archive
          fi
          
          # Handle case where files extract into a subdirectory
          if [ ! -f "bin/clang" ]; then
            SUBDIR=$(ls -d */ 2>/dev/null | head -1)
            if [ -n "$SUBDIR" ] && [ -f "${SUBDIR}bin/clang" ]; then
              mv ${SUBDIR}* .
              rmdir "$SUBDIR"
            fi
          fi
          
          echo "=== Clang version ==="
          ./bin/clang --version

      - name: Download AOSP GCC 4.9
        run: |
          cd ${{ github.workspace }}/toolchain
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc-aarch64
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc-arm

      - name: Build Kernel
        run: |
          cd ${{ github.workspace }}/kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=${{ github.workspace }}/toolchain/clang/bin:${{ github.workspace }}/toolchain/gcc-aarch64/bin:${{ github.workspace }}/toolchain/gcc-arm/bin:$PATH
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export STRIP=llvm-strip
          make O=out ARCH=arm64 vendor/xiaomi/miatoll-perf_defconfig
          make O=out ARCH=arm64 -j$(nproc)

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          ls ${{ github.workspace }}/kernel/out/arch/arm64/boot/
          cp ${{ github.workspace }}/kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null || cp ${{ github.workspace }}/kernel/out/arch/arm64/boot/Image.gz AnyKernel3/ 2>/dev/null || cp ${{ github.workspace }}/kernel/out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          zip -r9 ../AnyKernel3.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3
          path: AnyKernel3.zip
