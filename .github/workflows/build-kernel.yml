name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Mantii04/android_kernel_xiaomi_sm6250
          ref: lineage-23.2
          path: kernel

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libelf-dev libssl-dev python3 zip

      - name: Download AOSP Clang r596125
        run: |
          set -e
          mkdir -p ${{ github.workspace }}/toolchain/clang
          cd ${{ github.workspace }}/toolchain/clang
          COMMIT="663361308e09e4dc3c3b9c5f97c19f9c61e8a0ac"
          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/${COMMIT}/clang-r596125.tar.gz"
          curl -L -A "Mozilla/5.0" -o clang.tar.gz "$URL"
          tar -xzf clang.tar.gz
          echo "=== Clang version ==="
          ./bin/clang --version

      - name: Download AOSP GCC 4.9 from LineageOS Mirror
        run: |
          set -e
          cd ${{ github.workspace }}/toolchain
          
          echo "=== Cloning aarch64 GCC 4.9 ==="
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc-aarch64
          echo "=== Verifying aarch64 GCC ==="
          ls ${{ github.workspace }}/toolchain/gcc-aarch64/bin/ | head
          ${{ github.workspace }}/toolchain/gcc-aarch64/bin/aarch64-linux-android-gcc --version
          
          echo "=== Cloning arm GCC 4.9 ==="
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc-arm
          echo "=== Verifying arm GCC ==="
          ls ${{ github.workspace }}/toolchain/gcc-arm/bin/ | head
          ${{ github.workspace }}/toolchain/gcc-arm/bin/arm-linux-androideabi-gcc --version

      - name: Build Kernel
        run: |
          set -e
          cd ${{ github.workspace }}/kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=${{ github.workspace }}/toolchain/clang/bin:${{ github.workspace }}/toolchain/gcc-aarch64/bin:${{ github.workspace }}/toolchain/gcc-arm/bin:$PATH
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export STRIP=llvm-strip
          
          echo "=== Verifying compilers are in PATH ==="
          which aarch64-linux-android-gcc
          which clang
          
          make O=out ARCH=arm64 vendor/xiaomi/miatoll-perf_defconfig
          make O=out ARCH=arm64 -j$(nproc)

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          ls ${{ github.workspace }}/kernel/out/arch/arm64/boot/
          cp ${{ github.workspace }}/kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null || \
          cp ${{ github.workspace }}/kernel/out/arch/arm64/boot/Image.gz AnyKernel3/ 2>/dev/null || \
          cp ${{ github.workspace }}/kernel/out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          zip -r9 ../AnyKernel3.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3
          path: AnyKernel3.zip
