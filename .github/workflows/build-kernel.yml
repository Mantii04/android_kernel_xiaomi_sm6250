name: Build Kernel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Mantii04/android_kernel_xiaomi_sm6250
          ref: lineage-23.2
          path: kernel-source

      - name: Build Kernel with Exact AOSP Clang
        uses: dabao1955/kernel_build_action@v1.10.2
        with:
          kernel-url: ./kernel-source/
          config: vendor/xiaomi/miatoll-perf_defconfig
          arch: arm64
          android-version: '16'
          aosp-clang: true
          aosp-clang-version: r596125
          anykernel3: true
          release: true
          access-token: ${{ secrets.GITHUB_TOKEN }}
